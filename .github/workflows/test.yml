
name: Test

on: 
  push:

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - name: Copy project to machine
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci 

      - name: Run test
        run: npm test